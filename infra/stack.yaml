AWSTemplateFormatVersion: "2010-09-09"
Description: >
  AHPN proof of concept. One Fargate task scrapes a public document into S3,
  reads the pages with Textract, and stores OCR lines and chunks in RDS Postgres.


Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two subnets in different AZs with a route to an internet gateway.
  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
  ImageTag:
    Type: String
    Default: latest

Resources:
  DocumentBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "ahpn-documents-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: ahpn
      EmptyOnDelete: true

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ahpn/pipeline
      RetentionInDays: 14

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: AHPN pipeline tasks (outbound only)
      VpcId: !Ref VpcId

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: AHPN Postgres, reachable only from pipeline tasks
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref TaskSecurityGroup

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: AHPN Postgres
      SubnetIds: !Ref SubnetIds

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Engine: postgres
      EngineVersion: "17.6"
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: "20"
      StorageType: gp3
      StorageEncrypted: true
      DBName: ahpn
      MasterUsername: ahpn
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups:
        - !Ref DbSecurityGroup
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 1
      DeletionProtection: false

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: ahpn

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-db-secret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !GetAtt Database.MasterUserSecret.SecretArn

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: pipeline
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: textract:DetectDocumentText
                Resource: "*"
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub "${DocumentBucket.Arn}/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DocumentBucket.Arn

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: ahpn-pipeline
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: ahpn
          Image: !Sub "${Repository.RepositoryUri}:${ImageTag}"
          Essential: true
          Environment:
            - { Name: AWS_REGION, Value: !Ref "AWS::Region" }
            - { Name: AHPN_STORAGE, Value: s3 }
            - { Name: AHPN_S3_BUCKET, Value: !Ref DocumentBucket }
            - { Name: AHPN_S3_PREFIX, Value: documents }
            - { Name: AHPN_DB_HOST, Value: !GetAtt Database.Endpoint.Address }
            - { Name: AHPN_DB_PORT, Value: !GetAtt Database.Endpoint.Port }
            - { Name: AHPN_DB_NAME, Value: ahpn }
            - { Name: AHPN_DB_USER, Value: ahpn }
          Secrets:
            - Name: AHPN_DB_PASSWORD
              ValueFrom: !Sub "${Database.MasterUserSecret.SecretArn}:password::"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: pipeline

Outputs:
  BucketName:
    Value: !Ref DocumentBucket
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
  ClusterName:
    Value: !Ref Cluster
  TaskDefinitionArn:
    Value: !Ref TaskDefinition
  TaskSecurityGroupId:
    Value: !Ref TaskSecurityGroup
  SubnetIds:
    Value: !Join [",", !Ref SubnetIds]
  LogGroupName:
    Value: !Ref LogGroup
  DbEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  DbSecretArn:
    Value: !GetAtt Database.MasterUserSecret.SecretArn
