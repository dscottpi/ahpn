[project]
name = "ahpn"
version = "0.1.0"
description = "Scrape, OCR, and chunk public documents from the AHPN digital archive."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.35",
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
s3 = [
    "boto3>=1.35",
]

[project.scripts]
ahpn = "ahpn.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
